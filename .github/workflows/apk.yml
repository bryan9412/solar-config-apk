name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bryan9412/solar-config
          path: sitio
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Copiar la app como assets
        run: |
          mkdir -p app/src/main/assets app/src/main/res/mipmap-xxxhdpi
          cp sitio/index.html sitio/icon.svg sitio/favicon-64.png app/src/main/assets/
          cp sitio/icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - name: Publicar release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Configuracion-solar.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Configuracion-solar.apk --title "APK Configuración solar" --notes "Descarga Configuracion-solar.apk desde el celular."
